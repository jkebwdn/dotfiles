# hyprpaper.conf (new syntax)

ipc = true
splash = false

# eDP-1 (laptop)
wallpaper {
  monitor = eDP-1
  path = /home/jkebwdn/Pictures/wallpapers/ThinkpadLaptopClose.png
  fit_mode = cover
}

# HDMI-A-1 (external) – optional, only used when connected
wallpaper {
  monitor = HDMI-A-1
  path = /home/jkebwdn/Pictures/wallpapers/ThinkpadLaptopClose.png
  fit_mode = cover
}

# Fallback (applies to any monitor without a specific target)
wallpaper {
  monitor =
  path = /home/jkebwdn/Pictures/wallpapers/ThinkpadLaptopClose.png
  fit_mode = cover
}

