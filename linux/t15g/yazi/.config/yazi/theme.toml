[mgr]
# MAGI flavour owns: cwd = { fg = "#b4befe", bold = true }

# MAGI flavour owns: find_keyword = { fg = "#f9e2af", bold = true }
# MAGI flavour owns: find_position = { fg = "#f5c2e7", bg = "reset", bold = true }

# MAGI flavour owns: symlink_target = { fg = "#89dceb", italic = true }

# MAGI flavour owns: marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
# MAGI flavour owns: marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
# MAGI flavour owns: marker_marked = { fg = "#cba6f7", bg = "#cba6f7" }
# MAGI flavour owns: marker_selected = { fg = "#b4befe", bg = "#b4befe" }

# MAGI flavour owns: count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
# MAGI flavour owns: count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
# MAGI flavour owns: count_selected = { fg = "#1e1e2e", bg = "#b4befe" }

border_symbol = "│"
# MAGI flavour owns: border_style = { fg = "#313244" }


# ---------------------------------------------------------
# Pane indicators
# No brackets / blocks around the current rows
# ---------------------------------------------------------

[indicator]
# MAGI flavour owns: parent = { fg = "#6c7086", bg = "reset" }
# MAGI flavour owns: current = { fg = "#b4befe", bg = "reset" }
# MAGI flavour owns: preview = { fg = "#45475a", bg = "reset" }

padding = { open = "", close = "" }


# ---------------------------------------------------------
# Tabs
# Flat text only — no pill backgrounds
# ---------------------------------------------------------

[tabs]
# MAGI flavour owns: active = { fg = "#b4befe", bg = "reset", bold = true }
# MAGI flavour owns: inactive = { fg = "#6c7086", bg = "reset" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


# ---------------------------------------------------------
# Modes
# Keep the information, but stop making NOR a big block
# ---------------------------------------------------------

[mode]
# MAGI flavour owns: normal_main = { fg = "#b4befe", bg = "reset", bold = true }
# MAGI flavour owns: normal_alt = { fg = "#6c7086", bg = "reset" }

# MAGI flavour owns: select_main = { fg = "#cba6f7", bg = "reset", bold = true }
# MAGI flavour owns: select_alt = { fg = "#6c7086", bg = "reset" }

# MAGI flavour owns: unset_main = { fg = "#f38ba8", bg = "reset", bold = true }
# MAGI flavour owns: unset_alt = { fg = "#6c7086", bg = "reset" }


# ---------------------------------------------------------
# Status
# Flat, quiet and transparent
# ---------------------------------------------------------

[status]
# MAGI flavour owns: overall = { fg = "#6c7086", bg = "reset" }

sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# MAGI flavour owns: perm_type = { fg = "#b4befe" }
# MAGI flavour owns: perm_read = { fg = "#a6e3a1" }
# MAGI flavour owns: perm_write = { fg = "#f9e2af" }
# MAGI flavour owns: perm_exec = { fg = "#f38ba8" }
# MAGI flavour owns: perm_sep = { fg = "#45475a" }

# MAGI flavour owns: progress_label = { fg = "#bac2de" }
# MAGI flavour owns: progress_normal = { fg = "#b4befe", bg = "reset" }
# MAGI flavour owns: progress_error = { fg = "#f38ba8", bg = "reset" }


