# ---------------------------------------------------------
# AeroSpace
# macOS / Mac mini
# ---------------------------------------------------------

config-version = 2

# Start AeroSpace automatically at login
start-at-login = true

# Automatically reload config changes
auto-reload-config = true

# Commands to run after AeroSpace starts
after-startup-command = []

# Notify SketchyBar whenever the focused workspace changes
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; ~/.config/aerospace/scripts/borders-workspace.sh'
]

on-focus-changed = [
    'exec-and-forget ~/.config/aerospace/scripts/borders-workspace.sh'
]

# ---------------------------------------------------------
# Window behaviour
# ---------------------------------------------------------

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

# ---------------------------------------------------------
# Gaps
# ---------------------------------------------------------

gaps.inner.horizontal = 16
gaps.inner.vertical = 16

gaps.outer.left = 16
gaps.outer.right = 16
gaps.outer.bottom = 16

# SketchyBar:
# 38 px bar area
# 8 px top inset
# ~10 px breathing room
gaps.outer.top = 56

# ---------------------------------------------------------
# MAIN MODE
# ---------------------------------------------------------

[mode.main.binding]

# Focus windows
cmd-left  = 'focus left'
cmd-down  = 'focus down'
cmd-up    = 'focus up'
cmd-right = 'focus right'

# Move windows
cmd-shift-left  = 'move left'
cmd-shift-down  = 'move down'
cmd-shift-up    = 'move up'
cmd-shift-right = 'move right'

# Resize windows
cmd-ctrl-left  = 'resize width -50'
cmd-ctrl-right = 'resize width +50'
cmd-ctrl-up    = 'resize height -50'
cmd-ctrl-down  = 'resize height +50'

# Floating / tiling
cmd-alt-v = 'layout floating tiling'

# Fullscreen
cmd-alt-f = 'fullscreen'

# Layout
cmd-alt-t = 'layout tiles accordion'

# Workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# Move window to workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
