# ---------------------------------------------------------
# AeroSpace
# macOS / Mac mini
# ---------------------------------------------------------

config-version = 2

# Start AeroSpace automatically when logging into macOS
start-at-login = true

# Automatically reload this file whenever it is saved
auto-reload-config = true

# Commands to run after AeroSpace starts
after-startup-command = []

# ---------------------------------------------------------
# Window behaviour
# ---------------------------------------------------------

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default tiling behaviour
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Don't change focus just because the mouse moves
focus-follows-mouse.enabled = false

# Standard keyboard layout
key-mapping.preset = 'qwerty'

# ---------------------------------------------------------
# Gaps
# ---------------------------------------------------------
# Zero for now.
# We'll configure these properly when styling the desktop.

gaps.inner.horizontal = 10
gaps.inner.vertical = 10

gaps.outer.left = 10
gaps.outer.bottom = 10
gaps.outer.top = 10
gaps.outer.right = 10

# ---------------------------------------------------------
# MAIN MODE
# ---------------------------------------------------------

[mode.main.binding]

# ---------------------------------------------------------
# Focus windows
#
# Hyprland: SUPER + Arrow
# macOS:    CMD   + Arrow
# ---------------------------------------------------------

cmd-left  = 'focus left'
cmd-down  = 'focus down'
cmd-up    = 'focus up'
cmd-right = 'focus right'

# ---------------------------------------------------------
# Move windows
#
# Hyprland: SUPER + SHIFT + Arrow
# macOS:    CMD   + SHIFT + Arrow
# ---------------------------------------------------------

cmd-shift-left  = 'move left'
cmd-shift-down  = 'move down'
cmd-shift-up    = 'move up'
cmd-shift-right = 'move right'

# ---------------------------------------------------------
# Resize windows
#
# Hyprland: SUPER + CTRL + Arrow
# macOS:    CMD   + CTRL + Arrow
# ---------------------------------------------------------

cmd-ctrl-left  = 'resize width -50'
cmd-ctrl-right = 'resize width +50'
cmd-ctrl-up    = 'resize height -50'
cmd-ctrl-down  = 'resize height +50'

# ---------------------------------------------------------
# Floating / Tiling
#
# CMD + V is reserved for macOS Paste, so we use:
# CMD + OPTION + V
# ---------------------------------------------------------

cmd-alt-v = 'layout floating tiling'

# ---------------------------------------------------------
# Fullscreen
#
# CMD + F is reserved for macOS Find, so we use:
# CMD + OPTION + F
# ---------------------------------------------------------

cmd-alt-f = 'fullscreen'

# ---------------------------------------------------------
# Layout
#
# Toggle between tiled and accordion layouts
# ---------------------------------------------------------

cmd-alt-t = 'layout tiles accordion'

# ---------------------------------------------------------
# Workspaces
#
# Hyprland: SUPER + Number
# macOS:    CMD   + Number
# ---------------------------------------------------------

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# ---------------------------------------------------------
# Move window to workspace
#
# Hyprland: SUPER + SHIFT + Number
# macOS:    CMD   + SHIFT + Number
# ---------------------------------------------------------

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
